services:

  # ── Reverse proxy (Traefik) ──────────────────────────────────────────────────
  # Domaines accessibles sans /etc/hosts (*.localhost résolu nativement) :
  #   http://trippier.localhost           → frontend
  #   http://api.poi.trippier.localhost   → poi-api
  #   http://api.ai.trippier.localhost    → itinerary-api
  #   http://auth.trippier.localhost      → auth-api
  #   http://mailhog.trippier.localhost   → mailhog UI
  #   http://traefik.trippier.localhost   → Traefik dashboard

  traefik:
    image: traefik:v3.2
    environment:
      DOCKER_API_VERSION: "1.54"
    ports:
      - "80:80"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.trippier.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mailhog.trippier.localhost`)"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  # ── auth-api — Go hot reload via air ────────────────────────────────────────

  auth-api:
    build:
      context: ./auth-api
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8081"
    volumes:
      - ./auth-api:/app
      - auth-api-tmp:/app/tmp
    env_file:
      - .env
    environment:
      AUTH_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AUTH_REDIS_URL: redis://redis:6379
      AUTH_INTERNAL_SECRET: ${INTERNAL_SECRET}
      AUTH_SMTP_HOST: mailhog
      AUTH_APP_URL: ${APP_URL:-http://trippier.localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-api.rule=Host(`auth.trippier.localhost`)"
      - "traefik.http.services.auth-api.loadbalancer.server.port=8081"

  # ── poi-api — Go hot reload via air ─────────────────────────────────────────

  poi-api:
    build:
      context: ./poi-api
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./poi-api:/app
      - poi-api-tmp:/app/tmp
    env_file:
      - .env
    environment:
      POI_REDIS_URL: redis://redis:6379
      POI_AUTH_API_URL: http://auth-api:8081
      POI_INTERNAL_SECRET: ${INTERNAL_SECRET}
      POI_LOG_LEVEL: debug
    depends_on:
      redis:
        condition: service_healthy
      auth-api:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.poi-api.rule=Host(`api.poi.trippier.localhost`)"
      - "traefik.http.services.poi-api.loadbalancer.server.port=8080"

  # ── itinerary-api — Python hot reload via uvicorn --reload ──────────────────

  itinerary-api:
    build:
      context: ./itinerary-api
    ports:
      - "8000:8000"
    volumes:
      - ./itinerary-api:/app
    env_file:
      - .env
    environment:
      POI_API_URL: http://poi-api:8080
      AUTH_API_URL: http://auth-api:8081
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - poi-api
      - auth-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.itinerary-api.rule=Host(`api.ai.trippier.localhost`)"
      - "traefik.http.services.itinerary-api.loadbalancer.server.port=8000"

  # ── frontend — bun dev with Vite HMR ────────────────────────────────────────

  frontend:
    image: oven/bun:1-alpine
    working_dir: /app
    ports:
      - "3000:3000"
      - "24678:24678"
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    environment:
      AUTH_API_URL: http://auth-api:8081
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      FRONTEND_POI_API_URL: http://poi-api:8080
      FRONTEND_ITINERARY_API_URL: http://itinerary-api:8000
      PUBLIC_ADMIN_EMAILS: ${PUBLIC_ADMIN_EMAILS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    command: sh -c "bun install --frozen-lockfile && bunx svelte-kit sync && bun run dev --host"
    depends_on:
      - auth-api
      - poi-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`trippier.localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  auth-api-tmp:
  poi-api-tmp:
  frontend-modules:
