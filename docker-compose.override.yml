# Development overrides — auto-loaded by `docker compose up` (and `make dev`).
# Layers Traefik, hot reload (air / uvicorn --reload / Vite HMR) and source
# mounts on top of docker-compose.yml.
#
# Domains resolve without editing /etc/hosts (*.localhost is native):
#   http://trippier.localhost           -> frontend
#   http://api.poi.trippier.localhost   -> poi-api
#   http://api.ai.trippier.localhost    -> itinerary-api
#   http://auth.trippier.localhost      -> auth-api
#   http://mailhog.trippier.localhost   -> MailHog UI
#   http://traefik.trippier.localhost   -> Traefik dashboard (also on :8090)

services:

  ########################## Reverse proxy (dev only) ##########################

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.54"
    ports:
      - "80:80"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.trippier.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"

  mailhog:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mailhog.trippier.localhost`)"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  ###################### auth-api — Go hot reload via air ######################

  auth-api:
    build:
      dockerfile: Dockerfile.dev
    environment:
      AUTH_APP_URL: ${APP_URL:-http://trippier.localhost}
    volumes:
      - ./auth-api:/app
      - auth-api-tmp:/app/tmp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-api.rule=Host(`auth.trippier.localhost`)"
      - "traefik.http.services.auth-api.loadbalancer.server.port=8081"

  ###################### poi-api — Go hot reload via air #######################

  poi-api:
    build:
      dockerfile: Dockerfile.dev
    environment:
      POI_LOG_LEVEL: debug
    volumes:
      - ./poi-api:/app
      - poi-api-tmp:/app/tmp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.poi-api.rule=Host(`api.poi.trippier.localhost`)"
      - "traefik.http.services.poi-api.loadbalancer.server.port=8080"

  ########### itinerary-api — Python hot reload via uvicorn --reload ###########

  itinerary-api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./itinerary-api:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.itinerary-api.rule=Host(`api.ai.trippier.localhost`)"
      - "traefik.http.services.itinerary-api.loadbalancer.server.port=8000"

  ################## frontend — Bun dev server with Vite HMR ###################

  frontend:
    build:
      dockerfile: Dockerfile.dev
    command: sh -c "bun install --frozen-lockfile && bunx svelte-kit sync && bun run dev --host"
    ports:
      - "24678:24678"
    environment:
      PUBLIC_POI_API_URL: http://localhost:8080
      PUBLIC_ITINERARY_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`trippier.localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  auth-api-tmp:
  poi-api-tmp:
  frontend-modules:
