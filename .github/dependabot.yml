version: 2

updates:
  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # Go modules — minor/patch grouped, majors raised individually
  - package-ecosystem: gomod
    directory: "/auth-api"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      go-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: "/poi-api"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      go-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python (itinerary-api)
  - package-ecosystem: pip
    directory: "/itinerary-api"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    ignore:
      # pytest 9 drops the asyncio default mode our tests rely on; hold at 8.x.
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend (package.json)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    ignore:
      # vite 8 is a major jump for the SvelteKit build; hold at 5.x for now.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images referenced in the Dockerfiles
  - package-ecosystem: docker
    directories:
      - "/auth-api"
      - "/poi-api"
      - "/itinerary-api"
      - "/frontend"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    ignore:
      # itinerary-api pins an older pydantic without 3.14 wheels; hold the base
      # image at 3.13 until the Python deps support 3.14.
      - dependency-name: "python"
        versions: [">=3.14"]
    groups:
      docker:
        patterns: ["*"]
