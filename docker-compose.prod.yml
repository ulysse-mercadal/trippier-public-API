services:

  # ── Reverse proxy ────────────────────────────────────────────────────────────

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.54"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── auth-api ─────────────────────────────────────────────────────────────────

  auth-api:
    image: ghcr.io/${OWNER}/auth-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AUTH_REDIS_URL: redis://redis:6379
      AUTH_INTERNAL_SECRET: ${INTERNAL_SECRET}
      AUTH_SMTP_HOST: ${SMTP_HOST:-mailhog}
      AUTH_SMTP_PORT: ${SMTP_PORT:-1025}
      AUTH_SMTP_USER: ${SMTP_USER:-}
      AUTH_SMTP_PASS: ${SMTP_PASS:-}
      AUTH_APP_URL: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── poi-api ──────────────────────────────────────────────────────────────────

  poi-api:
    image: ghcr.io/${OWNER}/poi-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POI_REDIS_URL: redis://redis:6379
      POI_AUTH_API_URL: http://auth-api:8081
      POI_INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      auth-api:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.poi-api.rule=Host(`api.poi.${DOMAIN}`)"
      - "traefik.http.routers.poi-api.entrypoints=websecure"
      - "traefik.http.routers.poi-api.tls.certresolver=le"
      - "traefik.http.services.poi-api.loadbalancer.server.port=8080"

  # ── itinerary-api ────────────────────────────────────────────────────────────

  itinerary-api:
    image: ghcr.io/${OWNER}/itinerary-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POI_API_URL: http://poi-api:8080
      AUTH_API_URL: http://auth-api:8081
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      - poi-api
      - auth-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.itinerary-api.rule=Host(`api.ai.${DOMAIN}`)"
      - "traefik.http.routers.itinerary-api.entrypoints=websecure"
      - "traefik.http.routers.itinerary-api.tls.certresolver=le"
      - "traefik.http.services.itinerary-api.loadbalancer.server.port=8000"

  # ── frontend ─────────────────────────────────────────────────────────────────

  frontend:
    image: ghcr.io/${OWNER}/frontend:latest
    restart: unless-stopped
    environment:
      AUTH_API_URL: http://auth-api:8081
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      FRONTEND_POI_API_URL: http://poi-api:8080
      FRONTEND_ITINERARY_API_URL: http://itinerary-api:8000
      PUBLIC_ADMIN_EMAILS: ${PUBLIC_ADMIN_EMAILS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    depends_on:
      - auth-api
      - poi-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  redis_data:
